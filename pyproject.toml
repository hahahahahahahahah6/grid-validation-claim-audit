[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-validation-claim-audit"
version = "0.1.0"
description = "Offline audit of documented release identifier claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
grid-validation-claim-audit = "grid_validation_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["grid_validation_claim_audit*"]
